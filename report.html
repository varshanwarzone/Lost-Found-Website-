<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo-title">
            <img src="logo.png" alt="University of Vavuniya Logo" class="logo">

            <h2>Lost &amp; Found | University of Vavuniya</h2>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="report.html">Report Lost</a>
            <a href="found.html">Found Items</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main>

        <h1 class="page-title">
            Report Lost Item 🔖
        </h1>

        <div class="form-box">

            <input
                type="text"
                id="itemName"
                placeholder="Item Name"
                required
            >

            <input
                type="text"
                id="locationLost"
                placeholder="Location Lost"
                required
            >

            <input
                type="tel"
                id="contactPhone"
                placeholder="Contact Number"
                required
            >

            <input
                type="date"
                id="dateLost"
            >

            <textarea
                id="description"
                placeholder="Description"
                rows="5"
            ></textarea>

            <button type="button" onclick="saveItem()">
                Submit
            </button>

        </div>

    </main>
<footer>
    <p>
        Lost &amp; Found System &copy; 2026 University of Vavuniya, Sri Lanka.
        All rights reserved.
    </p>
</footer>
    <script src="script.js"></script>

</body>

</html>
